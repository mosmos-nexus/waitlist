<!doctype html>
<html lang="%paraglide.lang%" data-theme="paper" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#EFEDE8" />
    <meta name="color-scheme" content="light" />
    <!-- Resolve JS + motion preference before first paint: scroll-reveal can then
         hide-then-reveal without FOUC, while no-JS and reduced-motion visitors
         keep the final (visible) frame. -->
    <script>
      var r = document.documentElement;
      r.classList.remove('no-js');
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
        r.classList.add('reduced-motion');
      }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Brand type. Both are the dynamic-subset builds: the stylesheet is a set
         of unicode-range'd @font-face rules, so the browser fetches only the
         woff2 chunks covering characters actually on the page. The unsplit
         Pretendard JP variable is 5.3 MB, which is not shippable. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard-jp/dist/web/variable/pretendardvariable-jp-dynamic-subset.css"
    />
    <!-- The wireframes set every micro label — eyebrows, counts, timestamps — in
         IBM Plex Mono. Two weights, latin only; the Korean around them stays
         Pretendard. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
