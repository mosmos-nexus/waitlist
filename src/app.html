<!doctype html>
<html lang="%paraglide.lang%" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#F7F8F9" />
    <meta name="color-scheme" content="light" />
    <!-- Resolve JS + motion preference before first paint, so anything animated
         can start from its final (visible) frame for no-JS and reduced-motion
         visitors instead of flashing. -->
    <script>
      var r = document.documentElement;
      r.classList.remove('no-js');
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
        r.classList.add('reduced-motion');
      }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Brand type. Both are the dynamic-subset builds: the stylesheet is a set
         of unicode-range'd @font-face rules, so the browser fetches only the
         woff2 chunks covering characters actually on the page. The unsplit
         Pretendard JP variable is 5.3 MB, which is not shippable. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard-jp/dist/web/variable/pretendardvariable-jp-dynamic-subset.css"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
